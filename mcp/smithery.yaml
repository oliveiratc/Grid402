name: "grid402-mcp"
version: 1.0.0
description: "Official Model Context Protocol (MCP) Server for Grid402 - Public Open Data e Network Utilities Hub (Forex, Crypto, DNS, SSL, ASN, CEP) with Base x402 micropayments."
startCommand:
  type: stdio
  config:
    command: npx
    args:
      - "-y"
      - "grid402-mcp"
    env:
      GRID402_ENDPOINT:
        type: string
        description: "Grid402 Hub API Endpoint"
        default: "https://orangered-jackal-900744.hostingersite.com"
      GRID402_PRIVATE_KEY:
        type: string
        description: "EVM private key on Base Mainnet for automated 0.0005 USDC x402 payment settlement (optional)"

