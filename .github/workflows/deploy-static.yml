name: Sync public_html to deploy branch

on:
  push:
    branches: [main]
    paths:
      - 'public_html/**'
      - '.github/workflows/deploy-static.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish public_html to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public_html
          publish_branch: deploy
          force_orphan: true
          commit_message: 'deploy: sync public_html from main (${{ github.sha }})'
