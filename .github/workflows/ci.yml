name: CI - Grid402 Test Suite & Provenance

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  test-php:
    name: PHP Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json, openssl
          ini-values: curl.cainfo="", openssl.cafile=""

      - name: Lint PHP Syntax
        run: |
          find public_html tests scripts -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Run Config Unit Tests
        run: php tests/test_config.php

      - name: Run Collector Unit Tests
        run: php tests/test_collector.php

      - name: Run x402 Gateway Tests
        run: php tests/test_x402_gateway.php

      - name: Run x402 Exact Parsing & Settlement Suites
        run: |
          php tests/test_x402_exact_parsing.php
          php tests/test_x402_exact_settlement.php
          php tests/test_facilitator_public.php

      - name: Run HTTP Integration Tests
        run: php tests/test_http_server.php

      - name: Run Badge Generator Tests
        run: php tests/test_badge.php

      - name: Run Sandbox, Navigation, Agent Discovery & AgentKit Suites
        run: |
          php tests/test_sandbox_mode.php
          php tests/test_responsive_navigation.php
          php tests/test_agent_discovery.php
          php tests/test_agentkit_integration.php

      - name: Run Multi-Process Concurrency, JSONL Logs & Load Tests
        run: php tests/test_concurrency_and_load.php

      - name: Run Master E2E Full Battery
        run: php tests/test_e2e_full.php

      - name: Verify Zero-DB Storage Integrity
        run: php scripts/verify_storage_integrity.php

      - name: Run Platform Maturity & M2M Controls Suite
        run: php tests/test_maturity_and_m2m_controls.php

  test-sdks:
    name: Client SDKs & MCP Server Tests
    runs-on: ubuntu-24.04
    needs: test-php

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python SDK & Run Tests
        run: |
          python -m pip install --upgrade pip
          pip install ./python
          python sdk/python/test_sdk.py
          python -m unittest python/tests/test_sdk.py -v
          python tests/test_sdk_python.py

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test Node.js SDK (ESM & CJS)
        run: |
          npm --prefix sdk/node test
          npm --prefix sdk/node run test:cjs
          node tests/test_sdk_node.mjs

      - name: Test Official MCP Server (24 tools)
        run: |
          npm --prefix mcp ci
          npm --prefix mcp test

  publish-provenance:
    name: Supply-Chain Provenance Attestation (npm & PyPI OIDC)
    runs-on: ubuntu-24.04
    needs: [test-php, test-sdks]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js with Registry OIDC Provenance
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish npm packages with SLSA Provenance
        if: env.NODE_AUTH_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish ./mcp --provenance --access public
          npm publish ./sdk/node --provenance --access public
          npm publish ./integrations/elizaos --provenance --access public

  publish-pypi:
    name: Publish Python SDK to PyPI (OIDC Trusted Publishing)
    runs-on: ubuntu-24.04
    needs: [test-php, test-sdks]
    if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_PYPI_OIDC == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build Python SDK distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build ./python

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          skip-existing: true

