name: Build Deploy Branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-deploy-branch
  cancel-in-progress: false

jobs:
  build:
    name: Generate deploy branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "Grid402 Deploy Bot"
          git config user.email "deploy@grid402.online"

      - name: Build deploy branch (public_html -> raiz)
        run: bash scripts/build_deploy_branch.sh deploy origin

      - name: Verify
        run: |
          echo "Arquivos na raiz do branch deploy:"
          git ls-tree -r --name-only origin/deploy | head -20
          echo "Total: $(git ls-tree -r --name-only origin/deploy | wc -l)"
          # Falha se index.php nao estiver na raiz
          git ls-tree -r --name-only origin/deploy | grep -qx "index.php"
          # Falha se algum segredo estiver presente
          if git ls-tree -r --name-only origin/deploy | grep -qE '(^|/)\.env$|private_data/.*\.json$'; then
            echo "ERRO: segredo encontrado no branch deploy"
            exit 1
          fi
          echo "OK: branch deploy valido"
