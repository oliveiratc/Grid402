name: Deploy - Grid402 (Hostinger)

on:
  workflow_run:
    workflows: ["CI - Grid402 Test Suite"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger (FTP)
    runs-on: ubuntu-latest
    needs: []  # runs independently; tests are enforced by branch protection on main
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, openssl

      - name: Lint PHP
        run: find public_html -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Smoke test (local)
        run: php tests/test_config.php

      - name: Deploy public_html via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./public_html/
          server-dir: ./
          exclude: |
            **/.git*
            **/.env
            **/private_data/*.json
            **/private_data/.env
            **/*.log
            **/node_modules/**
            **/dist/**
          dangerous-clean-slate: false

      - name: Notify
        if: always()
        run: |
          echo "Deploy finished with status: ${{ job.status }}"
          echo "Commit: ${{ github.sha }}"
